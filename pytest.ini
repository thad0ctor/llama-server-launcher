[pytest]
# ---------------------------------------------------------------------------
# pytest configuration for llama-server-launcher
# ---------------------------------------------------------------------------
#
# Markers
# -------
# ``slow``: tests that exercise the FULL real-launcher init/teardown cycle
#   ~20+ times in a single pytest invocation. On Python 3.13 this triggers
#   a Tcl-internal threading-state accumulation bug that deterministically
#   deadlocks ``ttk.Notebook.add()`` around the 10th launcher instance,
#   regardless of how aggressively we mark background threads as
#   "tk-dead". Symptom: pytest hangs indefinitely in
#   ``self.tk.call(self._w, "add", child, ...)``.
#
#   These tests are EXCLUDED from the default invocation (``addopts``
#   below) so a developer running ``pytest tests/`` doesn't hit the hang.
#   They remain runnable on demand via ``pytest -m slow`` or by passing
#   ``-m ""`` (explicitly clear the marker filter) to run everything.
#   CI runs them in a separate, isolated step so a failure there doesn't
#   poison the rest of the test matrix.
#
# Default marker filter: skip slow.
# ``-ra`` shows skipped/xfailed counts in the summary.
addopts = -m "not slow" -ra
markers =
    slow: tests that take ≥30s and may deadlock when many real-launcher
          instances accumulate Tcl threading state in the same process.
          Excluded from the default run; opt in via ``pytest -m slow``.
